<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PersonalOS Viewer</title>
</head>
<body>
  <p>Viewerを開いています…</p>
  <script>
    const DEFAULT_PRESENTATION = 'modern';
    const target = new URL(`./presentation/${DEFAULT_PRESENTATION}/`, window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
  <noscript><a href="./presentation/modern/">Viewerを開く</a></noscript>
</body>
</html>
