name: Plan Projection One-time Migration

on:
  push:
    paths:
      - 'scripts/migrate_plan_projection_20260916.py'
      - '.github/workflows/plan-projection-migration-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/migrate_plan_projection_20260916.py
      - run: python scripts/validate_plan_projection.py
      - name: Commit migration
        run: |
          if git diff --quiet -- data/plans/P001.json app.js; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plans/P001.json app.js
          git commit -m "Migrate Plan public projection to current flow semantics"
          git push
