name: Deploy PersonalOS Viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  architecture:
    name: Viewer Distribution Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check presentation isolation and frozen Legacy
        run: python tools/check_presentation_layout.py

  deploy:
    needs: architecture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site from delivered boundary
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site

          # Presentation generations are isolated under presentation/**.
          # Published Boundary data is already delivered by Publish and is copied
          # without regeneration or overlay in the Pages build.
          cp index.html manifest.json _site/
          cp -R data maps presentation _site/

          # The previous Modern reference still injects its browser Maps key into
          # its own isolated adapter. Current may choose a different binding later.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('_site/presentation/modern/viewer/shared/google-map.js')
          if path.exists():
              source = path.read_text(encoding='utf-8')
              marker = "const GOOGLE_MAPS_API_KEY = '__GOOGLE_MAPS_API_KEY__';"
              if source.count(marker) != 1:
                  raise RuntimeError('Modern reference Google Maps API key marker is missing or duplicated.')
              key = os.environ.get('GOOGLE_MAPS_API_KEY', '')
              replacement = f'const GOOGLE_MAPS_API_KEY = {json.dumps(key)};'
              path.write_text(source.replace(marker, replacement), encoding='utf-8')
          PY

          # Frozen Legacy keeps its historical local config contract. This is an
          # environment binding only; no Legacy data/presentation files are rebuilt.
          printf 'window.PERSONALOS_CONFIG = {\n  googleMapsApiKey: "%s"\n};\n' "$GOOGLE_MAPS_API_KEY" > _site/presentation/legacy/config.js
          touch _site/.nojekyll

      - name: Version mutable presentation assets
        run: python tools/version_presentation_assets.py _site "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
