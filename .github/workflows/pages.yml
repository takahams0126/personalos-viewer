name: Deploy PersonalOS Viewer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  architecture:
    name: Viewer Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check modern Viewer architecture
        run: python tools/check_viewer_architecture.py

  build:
    name: Build site
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R index.html index2.html app.js manifest.json data maps presentation viewer _site/

          # Viewer v2 injects the browser key directly into its Google Maps adapter.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('_site/viewer/shared/google-map.js')
          source = path.read_text(encoding='utf-8')
          marker = "const GOOGLE_MAPS_API_KEY = '__GOOGLE_MAPS_API_KEY__';"
          if source.count(marker) != 1:
              raise RuntimeError('Google Maps API key injection marker is missing or duplicated.')

          key = os.environ.get('GOOGLE_MAPS_API_KEY', '')
          replacement = f'const GOOGLE_MAPS_API_KEY = {json.dumps(key)};'
          path.write_text(source.replace(marker, replacement), encoding='utf-8')
          PY

          # Legacy Viewer compatibility (index.html / app.js).
          # TODO: Remove config.js generation when the legacy Viewer path is retired.
          printf 'window.PERSONALOS_CONFIG = {\n  googleMapsApiKey: "%s"\n};\n' "$GOOGLE_MAPS_API_KEY" > _site/config.js
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
