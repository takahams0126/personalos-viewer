name: Deploy PersonalOS Viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  architecture:
    name: Viewer Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check modern Viewer architecture
        run: python tools/check_viewer_architecture.py

  deploy:
    needs: architecture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete presentation input
        run: python tools/build_presentation_input.py

      - name: Build static site
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R index.html app.js manifest.json data maps legacy presentation viewer _site/
          if [ -d _generated/data ]; then
            cp -R _generated/data/. _site/data/
          fi
          mkdir -p _site/_prototype
          cp -R _prototype/poc _site/_prototype/

          # Modern Viewer injects the browser key directly into its Google Maps adapter.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('_site/viewer/shared/google-map.js')
          source = path.read_text(encoding='utf-8')
          marker = "const GOOGLE_MAPS_API_KEY = '__GOOGLE_MAPS_API_KEY__';"
          if source.count(marker) != 1:
              raise RuntimeError('Google Maps API key injection marker is missing or duplicated.')

          key = os.environ.get('GOOGLE_MAPS_API_KEY', '')
          replacement = f'const GOOGLE_MAPS_API_KEY = {json.dumps(key)};'
          path.write_text(source.replace(marker, replacement), encoding='utf-8')
          PY

          # Legacy Viewer compatibility (legacy/index.html -> ./config.js).
          printf 'window.PERSONALOS_CONFIG = {\n  googleMapsApiKey: "%s"\n};\n' "$GOOGLE_MAPS_API_KEY" > _site/legacy/config.js
          touch _site/.nojekyll

      - name: Version Viewer assets
        run: python tools/version_presentation_assets.py _site "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
