name: Plan Public Projection Validation

on:
  push:
    paths:
      - 'data/plans/**'
      - 'data/day-viewmodel.js'
      - 'data/plan-demo.js'
      - 'data/plan-demo.json'
      - 'app.js'
      - 'scripts/validate_plan_projection.py'
      - '.github/workflows/plan-public-projection-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_plan_projection.py
