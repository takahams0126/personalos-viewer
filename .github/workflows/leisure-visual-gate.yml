name: Leisure Visual Reality Gate

on:
  push:
    branches: [work/leisure-product-final-convergence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-reality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4

      - name: Build review site
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html manifest.json _site/
          cp -R data maps presentation _site/
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          key = os.environ.get('GOOGLE_MAPS_API_KEY', '')
          current_config = Path('_site/presentation/current/config.js')
          source = current_config.read_text(encoding='utf-8')
          marker = "googleMapsApiKey: '__GOOGLE_MAPS_API_KEY__'"
          if source.count(marker) != 1:
              raise RuntimeError('Current Google Maps API key marker is missing or duplicated.')
          current_config.write_text(source.replace(marker, 'googleMapsApiKey: ' + json.dumps(key)), encoding='utf-8')
          PY

      - name: Install browser driver client
        run: python -m pip install --disable-pip-version-check selenium

      - name: Capture desktop and mobile reality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-reality
          python -m http.server 8000 --directory _site >/tmp/leisure-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          OUT = Path('visual-reality')
          BASE = 'http://127.0.0.1:8000/presentation/current/'
          diagnostics = []

          surfaces = [
              ('explorer', ''),
              ('spot-S0016', '?type=spot&id=S0016'),
              ('spot-S0028', '?type=spot&id=S0028'),
              ('route-R004', '?type=route&id=R004'),
              ('route-R011', '?type=route&id=R011'),
              ('plan-P001', '?type=plan&id=P001'),
              ('concrete-CP001', '?type=concrete_plan&id=CP001'),
          ]

          def driver_for(width, height):
              options = Options()
              options.add_argument('--headless=new')
              options.add_argument('--no-sandbox')
              options.add_argument('--disable-dev-shm-usage')
              options.add_argument('--hide-scrollbars')
              options.add_argument(f'--window-size={width},{height}')
              options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})
              driver = webdriver.Chrome(options=options)
              driver.set_window_size(width, height)
              return driver

          def record_console(driver, context):
              for entry in driver.get_log('browser'):
                  if entry.get('level') in {'SEVERE', 'WARNING'}:
                      diagnostics.append({'context': context, **entry})

          def full_page_shot(driver, name, width):
              height = driver.execute_script('return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)')
              height = max(900, min(int(height) + 40, 16000))
              driver.set_window_size(width, height)
              time.sleep(0.25)
              driver.save_screenshot(str(OUT / f'{name}.png'))

          def load(driver, query, context):
              driver.get(BASE + query)
              try:
                  WebDriverWait(driver, 15).until(EC.presence_of_element_located((By.CSS_SELECTOR, '#app > *')))
              except Exception as exc:
                  diagnostics.append({'context': context, 'level': 'FATAL', 'message': f'app content unavailable: {exc.__class__.__name__}'})
              time.sleep(1.2)
              record_console(driver, context)

          for mode, width, height in [('desktop', 1440, 1100), ('mobile', 390, 844)]:
              driver = driver_for(width, height)
              try:
                  for name, query in surfaces:
                      context = f'{mode}-{name}'
                      load(driver, query, context)
                      full_page_shot(driver, context, width)

                  load(driver, '?type=concrete_plan&id=CP001', f'{mode}-concrete-tabs')
                  for tab_name in ('fuel', 'cost'):
                      selector = f'.concrete-primary-tabs [data-view-id="{tab_name}"]'
                      matches = driver.find_elements(By.CSS_SELECTOR, selector)
                      if not matches:
                          diagnostics.append({'context': f'{mode}-concrete-{tab_name}', 'level': 'ERROR', 'message': f'missing tab: {selector}'})
                          full_page_shot(driver, f'{mode}-concrete-{tab_name}-missing', width)
                          continue
                      driver.execute_script('arguments[0].click()', matches[0])
                      time.sleep(0.4)
                      record_console(driver, f'{mode}-concrete-{tab_name}')
                      full_page_shot(driver, f'{mode}-concrete-{tab_name}', width)
              finally:
                  driver.quit()

          (OUT / 'diagnostics.json').write_text(json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload visual reality
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leisure-visual-reality
          path: visual-reality/*
          if-no-files-found: error
