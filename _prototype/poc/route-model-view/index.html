<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteModel View PoC</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <div class="poc-shell">
    <header class="poc-header">
      <p class="poc-kicker">PersonalOS Leisure · display PoC</p>
      <h1>RouteModel View</h1>
      <p class="poc-lead">ConcretePlan Day の「ルート詳細」を、RouteModel + RouteExecution から解決済みの表示用ViewModelで描画する検証です。</p>

      <div class="poc-context" aria-label="ConcretePlan Dayの想定ビュー">
        <span>行動順</span>
        <strong>ルート詳細</strong>

    <main id="route-model-root" data-view-model="./data/RM001.view.json?v=3" aria-live="polite">
      <p class="poc-loading">ルート詳細を読み込み中…</p>

  <script type="module" src="./app.js?v=3"></script>
