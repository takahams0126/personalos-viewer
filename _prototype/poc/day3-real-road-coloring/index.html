<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day3 実道路・区間色分け PoC</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #1f2937; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .hero { margin-bottom: 18px; }
    .hero h1 { margin: 4px 0 8px; font-size: clamp(24px, 3vw, 36px); }
    .hero p { margin: 0; color: #5b6472; line-height: 1.65; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #667085; }
    .notice { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fff7ed; color: #9a3412; font-size: 13px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    button { border: 1px solid #d0d5dd; background: white; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 700; color: #344054; }
    button.active { background: #101828; color: white; border-color: #101828; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
    .panel { background: white; border: 1px solid #e4e7ec; border-radius: 16px; overflow: hidden; box-shadow: 0 3px 14px rgba(16,24,40,.05); }
    #map { width: 100%; height: min(72vh, 760px); min-height: 520px; }
    .side { padding: 16px; max-height: min(72vh, 760px); overflow: auto; }
    .side h2 { margin: 0 0 6px; font-size: 18px; }
    .side > p { margin: 0 0 14px; color: #667085; font-size: 13px; line-height: 1.55; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .metric { background: #f8fafc; border-radius: 10px; padding: 10px; }
    .metric small { display: block; color: #667085; }
    .metric strong { display: block; margin-top: 2px; font-size: 17px; }
    .legend { display: grid; gap: 6px; }
    .leg { width: 100%; text-align: left; border-radius: 10px; padding: 9px 10px; display: grid; grid-template-columns: 16px 1fr; gap: 9px; align-items: start; font-weight: 500; }
    .leg:hover, .leg.is-active { background: #f2f4f7; }
    .swatch { width: 12px; height: 12px; border-radius: 4px; margin-top: 3px; }
    .leg-title { display: block; font-weight: 700; color: #344054; font-size: 13px; }
    .leg-sub { display: block; color: #667085; font-size: 12px; margin-top: 2px; }
    #message { padding: 20px; color: #b42318; display: none; }
    @media (max-width: 860px) {
      main { padding: 14px; }
      .layout { grid-template-columns: 1fr; }
      #map { height: 58vh; min-height: 420px; }
      .side { max-height: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="kicker">Independent PoC · ConcretePlan Day3 / R011</div>
      <h1>実道路を区間ごとに色分けすると分かりやすいか？</h1>
      <p>既存のLegacy Google Routes実道路geometryを再利用し、1本の道路線を立ち寄り区間ごとに分割して表示する視認性テストです。</p>
      <div class="notice">PoC専用。正式Viewer・表示変換層・Canonicalは変更していません。使用geometryはLegacy R011 previewで、現在のDay3 Canonical順序の正本ではありません。</div>
    </header>

    <div class="toolbar" aria-label="表示モード">
      <button id="mode-colored" class="active" type="button">区間色分け</button>
      <button id="mode-single" type="button">1色で比較</button>
    </div>

    <section class="layout">
      <div class="panel">
        <div id="map"></div>
        <div id="message"></div>
      </div>
      <aside class="panel side">
        <h2>R011 実道路区間</h2>
        <p>凡例へマウスを合わせると、その区間だけを強調します。</p>
        <div id="summary" class="summary"></div>
        <div id="legend" class="legend"></div>
      </aside>
    </section>
  </main>

  <script src="../../../legacy/config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
